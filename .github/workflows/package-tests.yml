name: Swift Package tests
on:
  pull_request:
  push:
    branches: [master]
jobs:
  ios-tests:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test UIKit package on iOS Simulator
        run: Scripts/test-package.sh -resultBundlePath TestResults.xcresult
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: test-results
          path: TestResults.xcresult
